<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Orders — UrbanCart Admin</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<link rel="stylesheet" href="{{ url_for('static', filename='css/admin_sidebar.css') }}">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --ink: #1a1a2e;
    --ink-light: #4a4a6a;
    --cream: #faf8f3;
    --gold: #c9a84c;
    --border: #e8e3d8;
    --sidebar-w: 220px;
  }
  body {
    font-family: 'DM Sans', sans-serif;
    background: var(--cream);
    color: var(--ink);
    display: flex;
    min-height: 100vh;
  }
  .sidebar {
    width: var(--sidebar-w);
    background: var(--ink);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    position: fixed;
    left: 0; top: 0; bottom: 0;
    z-index: 50;
  }
  .sidebar-logo {
    padding: 1.4rem 1.4rem 1rem;
    font-family: 'Playfair Display', serif;
    font-size: 1.3rem;
    font-weight: 600;
    color: #fff;
    border-bottom: 1px solid rgba(255,255,255,0.08);
  }
  .sidebar-logo span { color: var(--gold); }
  .sidebar-logo small {
    display: block;
    font-size: 0.65rem;
    color: rgba(255,255,255,0.35);
    letter-spacing: 1px;
    text-transform: uppercase;
    margin-top: 2px;
  }
  .sidebar-nav { flex: 1; padding: 0.8rem 0.6rem; display: flex; flex-direction: column; gap: 2px; }
  .nav-item {
    display: flex;
    align-items: center;
    gap: 0.7rem;
    padding: 0.6rem 0.9rem;
    border-radius: 9px;
    font-size: 0.83rem;
    color: rgba(255,255,255,0.55);
    text-decoration: none;
  }
  .nav-item:hover { background: rgba(255,255,255,0.07); color: rgba(255,255,255,0.85); }
  .nav-item.active { background: rgba(201,168,76,0.15); color: var(--gold); font-weight: 500; }
  .sidebar-footer { padding: 0.8rem; border-top: 1px solid rgba(255,255,255,0.08); }
  .logout-sidebar {
    display: block;
    text-align: center;
    padding: 0.5rem;
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 8px;
    color: rgba(255,255,255,0.4);
    font-size: 0.75rem;
    text-decoration: none;
  }
  .main { margin-left: var(--sidebar-w); flex: 1; display: flex; flex-direction: column; min-height: 100vh; }
  .topbar {
    background: #fff;
    border-bottom: 1px solid var(--border);
    padding: 0 2rem;
    height: 58px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    position: sticky; top: 0; z-index: 10;
  }
  .topbar h2 { font-family: 'Playfair Display', serif; font-size: 1.2rem; font-weight: 600; }
  .content { flex: 1; padding: 1.8rem 2rem; }
  .empty-state {
    text-align: center;
    padding: 4rem 2rem;
    color: var(--ink-light);
  }
  .empty-state p { font-size: 1rem; margin-bottom: 0.5rem; }
  @media (max-width: 768px) {
    .sidebar { width: 56px; }
    .sidebar-logo small, .nav-item span { display: none; }
    .main { margin-left: 56px; }
    .content { padding: 1rem; }
  }
</style>
</head>
<body>

{% include 'admin/_sidebar.html' %}

<div class="main">
  <div class="topbar">
    <h2>Orders</h2>
  </div>

  <div class="content">
    <div class="empty-state">
      <p style="font-size: 1.2rem; font-weight: 500;">📋 Orders Management</p>
      <p>No orders to display yet.</p>
    </div>
  </div>
</div>

</body>
</html>
