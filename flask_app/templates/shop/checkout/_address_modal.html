<div class="modal fade" id="coAddressModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-lg modal-dialog-scrollable">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="coAddressModalTitle">Add address</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <form id="co-address-modal-form" class="row g-3">
          <input type="hidden" name="addressId" id="addr-id">
          <div class="col-md-6"><label class="form-label">Full name</label><input class="form-control" name="fullName" required></div>
          <div class="col-md-6"><label class="form-label">Mobile</label><input class="form-control" name="mobile" required></div>
          <div class="col-12"><label class="form-label">House / Flat</label><input class="form-control" name="house" required></div>
          <div class="col-12"><label class="form-label">Street</label><input class="form-control" name="street" required></div>
          <div class="col-12"><label class="form-label">Landmark</label><input class="form-control" name="landmark"></div>
          <div class="col-md-5"><label class="form-label">City</label><input class="form-control" name="city" required></div>
          <div class="col-md-4"><label class="form-label">State</label><input class="form-control" name="state" required></div>
          <div class="col-md-3"><label class="form-label">PIN</label><input class="form-control" name="pincode" maxlength="6" required></div>
          <div class="col-12"><label class="form-label">Country</label><input class="form-control" name="country" value="India"></div>
          <div class="col-12 form-check"><input class="form-check-input" type="checkbox" name="isDefault" id="addr-default"><label class="form-check-label" for="addr-default">Set as default</label></div>
        </form>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancel</button>
        <button type="button" class="btn btn-dark" id="co-save-address">Save address</button>
      </div>
    </div>
  </div>
</div>
