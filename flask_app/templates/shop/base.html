<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="csrf-token" content="{{ csrf_token() }}">
    <title>{% block title %}Shop{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Playfair+Display:wght@500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/footer.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/shop_commerce.css') }}">
    {% block head %}{% endblock %}
    <script>
      window.ucCartState = window.ucCartState || { items: [], summary: { subtotal: 0, discountTotal: 0, gstTotal: 0, shippingTotal: 0, total: 0, count: {{ cart_count or 0 }} } };
      window.ucWishlistState = window.ucWishlistState || { items: [], count: {{ wishlist_count or 0 }} };
      window.ucCsrfToken = "{{ csrf_token() }}";
    </script>
  </head>
  <body>
    {% include 'components/navbar.html' %}

    <main class="uc-page-shell">
      {% block content %}{% endblock %}
    </main>

    {% from 'components/footer.html' import footer %}
    {{ footer() }}

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    {% block scripts %}{% endblock %}
    <script src="{{ url_for('static', filename='js/shop_commerce.js') }}"></script>
  </body>
</html>
